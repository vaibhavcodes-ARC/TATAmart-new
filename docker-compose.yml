services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      - backend
    networks:
      - tatamart_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - APP_KEY=${APP_KEY:?APP_KEY is required}
      - PHP_CLI_SERVER_WORKERS=4
      - BCRYPT_ROUNDS=8
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-tatamart_db}
      - DB_USERNAME=${DB_USERNAME:-tatamart_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
    depends_on:
      - mariadb
    networks:
      - tatamart_network

  mariadb:
    image: mariadb:10.11
    restart: always
    ports:
      - "3308:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${DB_DATABASE:-tatamart_db}
      MARIADB_USER: ${DB_USERNAME:-tatamart_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - tatamart_network

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
    depends_on:
      - mariadb
    networks:
      - tatamart_network

networks:
  tatamart_network:
    driver: bridge

volumes:
  db_data:
