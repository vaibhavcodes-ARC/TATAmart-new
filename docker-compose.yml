services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    networks:
      - tatamart_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000
      - JWT_SECRET=local-dev-jwt-secret-change-before-production
      - PHP_CLI_SERVER_WORKERS=4
      - BCRYPT_ROUNDS=8
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=tatamart_db
      - DB_USERNAME=tatamart_user
      - DB_PASSWORD=tatamart_pass
    depends_on:
      - mariadb
    networks:
      - tatamart_network

  mariadb:
    image: mariadb:10.11
    restart: always
    ports:
      - "3308:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: tatamart_db
      MARIADB_USER: tatamart_user
      MARIADB_PASSWORD: tatamart_pass
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - tatamart_network

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mariadb
      MYSQL_ROOT_PASSWORD: root_password
    depends_on:
      - mariadb
    networks:
      - tatamart_network

networks:
  tatamart_network:
    driver: bridge

volumes:
  db_data:
